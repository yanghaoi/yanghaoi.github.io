<svg width="100%" viewBox="0 0 680 448" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>PE 三级资源目录结构</title>
<desc>资源目录分三层：Type、Name、Language，最后指向 Data Entry。示例写入 7 个资源类型，其中 id=2 与 id=10 两个类型对 Windows 不可见。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="30" font-size="14" font-weight="500" fill="#212121">PE 三级资源目录结构</text>
<text x="40" y="50" font-size="12" fill="#5F5E5A">示例：写入 7 个资源类型，其中 2 个对系统不可见</text>

<rect x="40" y="66" width="600" height="96" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="84" font-size="13" font-weight="500" fill="#0C447C">第 1 层 · Type 目录</text>

<rect x="56" y="94" width="76" height="44" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="94" y="112" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">EDPEN…</text>
<text x="94" y="127" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">字符串名</text>

<rect x="139" y="94" width="76" height="44" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="177" y="112" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">EDPPER…</text>
<text x="177" y="127" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">字符串名</text>

<rect x="222" y="94" width="76" height="44" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="260" y="112" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">MUI</text>
<text x="260" y="127" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">字符串名</text>

<rect x="305" y="94" width="76" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="343" y="112" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">id=2</text>
<text x="343" y="127" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">BITMAP</text>
<path d="M367 100 L375 108 M375 100 L367 108" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round"/>

<rect x="388" y="94" width="76" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="426" y="112" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">id=10</text>
<text x="426" y="127" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">RCDATA</text>
<path d="M450 100 L458 108 M458 100 L450 108" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round"/>

<rect x="471" y="94" width="76" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="509" y="112" font-size="12" font-weight="500" fill="#173404" text-anchor="middle" dominant-baseline="central">id=16</text>
<text x="509" y="127" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">VERSION</text>

<rect x="554" y="94" width="76" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="592" y="112" font-size="12" font-weight="500" fill="#173404" text-anchor="middle" dominant-baseline="central">id=24</text>
<text x="592" y="127" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">MANIFEST</text>

<path d="M340 162 L340 178" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="182" width="600" height="72" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="200" font-size="13" font-weight="500" fill="#0C447C">第 2 层 · Name 目录</text>
<rect x="56" y="212" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="146" y="232" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">MICROSOFTEDP…</text>
<rect x="246" y="212" width="180" height="40" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="336" y="232" font-size="12" fill="#173404" text-anchor="middle" dominant-baseline="central">60984</text>
<rect x="436" y="212" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="526" y="232" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">PRND_51427DA4</text>

<path d="M340 254 L340 270" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="274" width="600" height="64" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="292" font-size="13" font-weight="500" fill="#0C447C">第 3 层 · Language 目录</text>
<rect x="56" y="302" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="116" y="316" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">0x0409</text>
<rect x="186" y="302" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="246" y="316" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">0x0804</text>
<rect x="316" y="302" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="376" y="316" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">0x0000</text>

<path d="M340 338 L340 354" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="358" width="600" height="52" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="384" font-size="13" font-weight="500" fill="#173404" text-anchor="middle" dominant-baseline="central">Data Entry · OffsetToData (RVA) + Size + CodePage</text>

<rect x="40" y="428" width="12" height="12" rx="3" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="58" y="437" font-size="11" fill="#5F5E5A" dominant-baseline="central">字符串名（排在前）</text>
<rect x="185" y="428" width="12" height="12" rx="3" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="203" y="437" font-size="11" fill="#5F5E5A" dominant-baseline="central">整数 ID（升序，在后）</text>
<rect x="330" y="428" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="348" y="437" font-size="11" fill="#5F5E5A" dominant-baseline="central">系统不可见</text>
</svg>
