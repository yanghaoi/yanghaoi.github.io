<svg width="100%" viewBox="0 0 680 404" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>两种资源提交顺序的对比</title>
<desc>顺序 A 先写标准类型再写自定义类型，在 865 资源样本上通过、在 notepad 样本上只剩 5/7；顺序 B 反过来，在 865 样本上报 ERROR_NOT_SUPPORTED、在 notepad 样本上 7/7 通过。两种顺序都不能通吃。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="30" font-size="14" font-weight="500" fill="#212121">两种提交顺序，各自只对一半样本有效</text>
<text x="40" y="50" font-size="12" fill="#5F5E5A">同一个 BeginUpdateResource 会话里，「字符串类型名」会毒化后续写入</text>

<rect x="40" y="70" width="600" height="120" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="56" y="92" font-size="13" font-weight="500" fill="#212121">顺序 A · 先标准类型，后自定义类型</text>

<rect x="56" y="104" width="160" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="72" y="124" font-size="12" font-weight="500" fill="#0C447C">趟 1 · 标准类型</text>
<text x="72" y="141" font-size="11" fill="#185FA5">864 个，一次写完</text>
<path d="M216 130 L246 130" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="246" y="104" width="160" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="262" y="124" font-size="12" font-weight="500" fill="#0C447C">趟 2 · 自定义类型</text>
<text x="262" y="141" font-size="11" fill="#185FA5">每个单独一个会话</text>
<path d="M406 130 L436 130" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="436" y="104" width="188" height="52" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<circle cx="452" cy="123" r="5.5" fill="#3B6D11"/>
<path d="M449 123 L451.5 125.5 L455.5 120.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="464" y="123" font-size="11" fill="#212121" dominant-baseline="central">865 样本 · 865/865 通过</text>
<circle cx="452" cy="141" r="5.5" fill="#A32D2D"/>
<path d="M449.5 138.5 L454.5 143.5 M454.5 138.5 L449.5 143.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
<text x="464" y="141" font-size="11" fill="#212121" dominant-baseline="central">notepad 样本 · 只剩 5/7</text>

<rect x="40" y="206" width="600" height="120" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="56" y="228" font-size="13" font-weight="500" fill="#212121">顺序 B · 先自定义类型，后标准类型</text>

<rect x="56" y="240" width="160" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="72" y="260" font-size="12" font-weight="500" fill="#0C447C">趟 1 · 自定义类型</text>
<text x="72" y="277" font-size="11" fill="#185FA5">每个单独一个会话</text>
<path d="M216 266 L246 266" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="246" y="240" width="160" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="262" y="260" font-size="12" font-weight="500" fill="#0C447C">趟 2 · 标准类型</text>
<text x="262" y="277" font-size="11" fill="#185FA5">864 个，一次写完</text>
<path d="M406 266 L436 266" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="436" y="240" width="188" height="52" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<circle cx="452" cy="259" r="5.5" fill="#A32D2D"/>
<path d="M449.5 256.5 L454.5 261.5 M454.5 256.5 L449.5 261.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
<text x="464" y="259" font-size="11" fill="#212121" dominant-baseline="central">865 样本 · 报错 50 失败</text>
<circle cx="452" cy="277" r="5.5" fill="#3B6D11"/>
<path d="M449 277 L451.5 279.5 L455.5 274.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="464" y="277" font-size="11" fill="#212121" dominant-baseline="central">notepad 样本 · 7/7 通过</text>

<rect x="40" y="340" width="600" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="340" y="362" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle" dominant-baseline="central">没有一种顺序通吃 → 写完回读校验，不达标就恢复副本换顺序重试</text>
</svg>
