<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>节表对比：注入前与注入后</title>
<desc>左侧为目标 PE 原始节表，不含 .rsrc 节；右侧为补 16 字节空目录头后的节表，新增 .rsrc 节，此后 UpdateResource 可正常工作。</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="30" font-size="14" font-weight="500" fill="#212121">节表对比：注入前与注入后</text>
<text x="40" y="50" font-size="12" fill="#5F5E5A">无资源目录的目标 PE，补一个空目录头后新增 .rsrc 节</text>

<!-- 左：注入前 -->
<rect x="40" y="66" width="272" height="222" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="56" y="88" font-size="13" font-weight="500" fill="#444441">注入前 · 节表</text>

<rect x="56" y="100" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="70" y="113" font-size="12" fill="#444441" dominant-baseline="central">.text</text>
<text x="280" y="113" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">代码</text>

<rect x="56" y="130" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="70" y="143" font-size="12" fill="#444441" dominant-baseline="central">.rdata</text>
<text x="280" y="143" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">只读数据</text>

<rect x="56" y="160" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="70" y="173" font-size="12" fill="#444441" dominant-baseline="central">.data</text>
<text x="280" y="173" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">可写数据</text>

<rect x="56" y="190" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="70" y="203" font-size="12" fill="#444441" dominant-baseline="central">.pdata</text>
<text x="280" y="203" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">异常处理</text>

<rect x="56" y="220" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="70" y="233" font-size="12" fill="#444441" dominant-baseline="central">.reloc</text>
<text x="280" y="233" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">重定位</text>

<text x="176" y="270" font-size="12" font-weight="500" fill="#A32D2D" text-anchor="middle">DataDirectory[2] = 0：不存在资源目录</text>

<!-- 中：箭头 -->
<path d="M330 176 L362 176" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="346" y="160" font-size="11" fill="#5F5E5A" text-anchor="middle">补 16 字节</text>
<text x="346" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">空目录头</text>

<!-- 右：注入后 -->
<rect x="370" y="66" width="272" height="222" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="386" y="88" font-size="13" font-weight="500" fill="#0C447C">注入后 · 节表</text>

<rect x="386" y="100" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="400" y="113" font-size="12" fill="#0C447C" dominant-baseline="central">.text</text>
<text x="610" y="113" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">代码</text>

<rect x="386" y="130" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="400" y="143" font-size="12" fill="#0C447C" dominant-baseline="central">.rdata</text>
<text x="610" y="143" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">只读数据</text>

<rect x="386" y="160" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="400" y="173" font-size="12" fill="#0C447C" dominant-baseline="central">.data</text>
<text x="610" y="173" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">可写数据</text>

<rect x="386" y="190" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="400" y="203" font-size="12" fill="#0C447C" dominant-baseline="central">.pdata</text>
<text x="610" y="203" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">异常处理</text>

<rect x="386" y="220" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="400" y="233" font-size="12" fill="#0C447C" dominant-baseline="central">.reloc</text>
<text x="610" y="233" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">重定位</text>

<rect x="386" y="250" width="240" height="26" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="400" y="263" font-size="12" font-weight="500" fill="#173404" dominant-baseline="central">.rsrc</text>
<text x="610" y="263" font-size="11" fill="#3B6D11" text-anchor="end" dominant-baseline="central">新增 · 虚拟大小 16 字节</text>

<text x="506" y="300" font-size="12" font-weight="500" fill="#3B6D11" text-anchor="middle">此后 UpdateResource 可正常工作，目录由系统构建</text>
</svg>